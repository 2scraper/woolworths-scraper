name: canary

# One real run a day against woolworths.com.au, and the only workflow in this
# repo that touches the site. Everything else is offline (see tests.yml).
#
# THIS CANARY RUNS LIVE, EVERY DAY, WITH NO CREDENTIAL — on purpose.
#
# It used to skip unless a `WOOLWORTHS_PROXY` secret was set, on the reasoning
# that "Akamai refuses this site to a datacentre address, and a GitHub runner
# is one". The first half of that was never measured and the second half does
# not follow. What WAS measured is that this site refuses HEADLESS and serves
# HEADFUL: 0 of 4 against 4 of 4 from one datacentre address on 2026-09-16.
# The gate was an inference from the wrong axis.
#
# Measured 2026-10-08, forcing the live path on a bare runner with no secret
# of any kind: Azure westus3, headful under Xvfb, **109 rows, status
# complete, exit 0, every assertion passed**. So the credential buys nothing
# here and the gate bought nothing but a green badge over an untested claim —
# every scheduled run since this repo went public had been the skip branch.
#
# Sections 21 and 24: a canary that CAN pass without a credential must never
# be gated on one. The README's central promise is that this site needs no
# key, no proxy and no account, and an ungated daily run is that sentence
# under test every morning. If Woolworths starts refusing runners, this goes
# red the next day and the promise is retested without anyone remembering to.
#
# A `WOOLWORTHS_PROXY` secret is still USED if one is set — it goes through
# the ENVIRONMENT rather than a `--proxy` line, because `env_config.py`
# already reads that variable, an unset secret arrives as an empty string
# which the loader treats as unset, and the credential never reaches a
# command line (§3).

on:
  schedule:
    - cron: "17 19 * * *"       # 05:17 Australian eastern time, off-peak
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Playwright engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-playwright.txt
          playwright install --with-deps chromium

      - name: Install Xvfb
        # Headful, not headless, and that is the measurement above rather
        # than a preference. A runner has no display, so the browser gets a
        # virtual one.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      # A FILTERED CATEGORY and >= 3 pages. One page never exercises
      # pagination, which is exactly how a silent single-page bug survived in
      # a sibling repo — and on this site page 2 onward is where the
      # ads-repeat-forever behaviour lives (§7).
      - name: Run the canary
        id: run
        env:
          WOOLWORTHS_PROXY: ${{ secrets.WOOLWORTHS_PROXY }}
        run: |
          # set +e: GitHub runs `run:` under `bash -e`, so a non-zero exit
          # would abort the step BEFORE the exit code could be captured, and
          # continue-on-error does not change that.
          set +e
          xvfb-run -a python3 playwright_scraper.py \
            --url "https://www.woolworths.com.au/shop/browse/bakery" \
            --pages 3 \
            --format json \
            --out canary 2>&1 | tee canary.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "The run exited $code."

      - name: Interpret the exit code
        run: |
          case "${{ steps.run.outputs.exit_code }}" in
            0) echo "::notice::Run completed." ;;
            3) echo "::error::Exit 3 — blocked. Akamai refused the proxy's exit. Check the exit is residential and, if it is, whether the site has changed what it refuses." ;;
            4) echo "::error::Exit 4 — zero products from a category that is not empty. This is the parser, not the site." ;;
            6) echo "::error::Exit 6 — partial. Some page failed; see the failed page numbers in the sidecar." ;;
            *) echo "::error::Unexpected exit ${{ steps.run.outputs.exit_code }}." ;;
          esac
          test "${{ steps.run.outputs.exit_code }}" = "0"

      # The thresholds are the numbers a real run produced on 2026-09-16, set
      # low enough to absorb an ordinary day's variation and high enough that
      # a broken read cannot pass. Bakery held 575 products over 16 pages;
      # three pages is ~110 rows, of which a handful are ads.
      - name: Assert what the run actually produced
        run: |
          python3 - <<'PY'
          import json, sys

          meta = json.load(open("canary.meta.json"))
          rows = json.load(open("canary.json"))
          problems = []

          def want(cond, msg):
              if not cond:
                  problems.append(msg)

          want(meta["status"] == "complete",
               f"status is {meta['status']!r}, not 'complete'")
          want(meta["pages_completed"] >= 3,
               f"only {meta['pages_completed']} page(s) completed; "
               "pagination is the thing this canary exists to exercise")
          want(not meta.get("pages_failed"),
               f"pages failed: {meta.get('pages_failed')}")
          want(len(rows) >= 90,
               f"{len(rows)} rows; three pages of this category produced ~110")

          priced = [r for r in rows if r.get("price") is not None]
          want(len(priced) / max(len(rows), 1) >= 0.90,
               f"only {len(priced)}/{len(rows)} rows carry a price")

          # Every row must have the id everything else joins on.
          want(all(r.get("sku") for r in rows), "some row has no sku")

          # page+position unique as a PAIR: position restarts each page, and
          # the column is worthless without page beside it.
          pairs = [(r["page"], r["position"]) for r in rows]
          want(len(set(pairs)) == len(pairs), "page+position is not unique")

          # The section 4 canary: a was-price that is not above the price
          # means WasPrice was read straight, which puts a 0% discount on
          # four products in five.
          bad = [r["sku"] for r in rows
                 if r.get("original_price") is not None
                 and r.get("price") is not None
                 and r["original_price"] <= r["price"]]
          want(not bad, f"rows with original_price <= price: {bad[:5]}")

          # The ads must be labelled. If this drops to zero the column has
          # stopped being filled, and the dedupe and the stop condition both
          # depend on it.
          want(any(r.get("is_sponsored") for r in rows)
               or meta.get("sponsored_rows") == 0,
               "no row is marked sponsored and the sidecar does not say zero")

          # The DOM cross-check ran and agreed. If the grid stops rendering —
          # the /unauthorisederror bounce — this is what notices, because the
          # rows themselves stay correct.
          dom = meta.get("dom_confirm")
          want(dom and dom.get("checked", 0) > 0,
               "no row was confirmed against a rendered tile; the grid may "
               "not have rendered (see unauthorised_redirect in the sidecar)")
          if dom and dom.get("checked"):
              share = dom["confirmed"] / dom["checked"]
              want(share >= 0.90,
                   f"only {share:.0%} of DOM-checked rows agreed on price")

          want(not meta.get("unauthorised_redirect"),
               "the app bounced the browser to /unauthorisederror — the rows "
               "are still the API's and correct, but the grid did not render")

          print(f"rows={len(rows)} priced={len(priced)} "
                f"pages={meta['pages_completed']} dom={dom}")
          if problems:
              print("\nFAILED:")
              for p in problems:
                  print(" -", p)
              sys.exit(1)
          print("All canary assertions passed.")
          PY

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-${{ github.run_id }}
          path: |
            canary.json
            canary.meta.json
            canary.log
            *_debug.html
            *_debug.png
          if-no-files-found: ignore
          retention-days: 14
